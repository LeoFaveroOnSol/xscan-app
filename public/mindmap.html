<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XSCAN — Mind Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
  
  #mindmap { width: 100vw; height: 100vh; cursor: grab; position: relative; }
  #mindmap:active { cursor: grabbing; }
  
  .node { position: absolute; border-radius: 12px; padding: 10px 16px; font-size: 13px; color: #e0e0e0; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; white-space: nowrap; user-select: none; }
  .node:hover { transform: scale(1.08); z-index: 100; }
  
  .root { background: linear-gradient(135deg, #9945FF, #14F195); font-size: 24px; font-weight: 800; color: #fff; padding: 20px 36px; border-radius: 22px; box-shadow: 0 0 50px rgba(153,69,255,0.5); letter-spacing: 1px; }
  
  .sector { font-size: 16px; font-weight: 700; padding: 14px 22px; border-radius: 14px; box-shadow: 0 0 25px rgba(0,0,0,0.5); }
  .sector-telegram { background: linear-gradient(135deg, #0088cc, #005f8c); }
  .sector-discord { background: linear-gradient(135deg, #5865F2, #3a42a0); }
  .sector-website { background: linear-gradient(135deg, #14F195, #0a8a5a); color: #000; }
  .sector-backend { background: linear-gradient(135deg, #FF6B35, #cc4a1a); }
  .sector-database { background: linear-gradient(135deg, #3ECF8E, #1a8a5a); color: #000; }
  
  .feature { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); font-size: 13px; font-weight: 600; padding: 8px 14px; }
  .feature:hover { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.3); }
  
  .sub { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); font-size: 11px; padding: 5px 10px; color: #999; border-radius: 8px; }
  
  svg.lines { position: absolute; top: 0; left: 0; pointer-events: none; }
  svg.lines path { fill: none; stroke-width: 1.8; opacity: 0.25; }
  
  .legend { position: fixed; bottom: 20px; right: 20px; background: rgba(20,20,30,0.95); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 14px 18px; color: #888; font-size: 11px; z-index: 200; }
  .legend div { margin: 4px 0; }
  .legend span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  
  .controls { position: fixed; bottom: 20px; left: 20px; display: flex; gap: 8px; z-index: 200; }
  .controls button { background: rgba(20,20,30,0.95); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #aaa; padding: 8px 14px; cursor: pointer; font-size: 14px; }
  .controls button:hover { background: rgba(40,40,60,0.95); color: #fff; }
</style>

<body>

<div class="controls">
  <button onclick="zoomIn()">＋</button>

        { id: 'db-chan', label: 'telegram_channels', cls: 'feature', angle: -260, dist: 150 },
        { id: 'db-grp', label: 'group_calls', cls: 'feature', angle: -180, dist: 140 },
        { id: 'db-usr', label: 'alert_users', cls: 'feature', angle: -280, dist: 145 },
        { id: 'db-ach', label: 'achievements', cls: 'feature', angle: -160, dist: 145 },

      ]

const container = document.getElementById('mindmap');
const svg = document.getElementById('lines');
let scale = 1, panX = 0, panY = 0, dragging = false, dragStartX, dragStartY;
const CX = 2500, CY = 2000; // Large canvas
const allNodes = [];

// Set SVG size
svg.style.width = '5000px';
svg.style.height = '4000px';

function getColor(id) {
  if (id.startsWith('tg') || id === 'telegram') return '#0088cc';
  if (id.startsWith('dc') || id === 'discord') return '#5865F2';
  if (id.startsWith('web') || id.startsWith('adm') || id.startsWith('doc') || id === 'website') return '#14F195';
  if (id.startsWith('be') || id === 'backend') return '#FF6B35';
  if (id.startsWith('db') || id === 'database') return '#3ECF8E';
  return '#666';
}

function build(node, px, py, parentColor) {
  const rad = (node.angle || 0) * Math.PI / 180;
  const x = px + Math.cos(rad) * (node.dist || 0);
  const y = py + Math.sin(rad) * (node.dist || 0);
  const color = parentColor || getColor(node.id);

  const el = document.createElement('div');
  el.className = `node ${node.cls}`;
  el.textContent = node.label;
  container.appendChild(el);
  
  allNodes.push({ el, x, y });
  
  requestAnimationFrame(() => {
    el.style.left = (x - el.offsetWidth / 2) + 'px';
    el.style.top = (y - el.offsetHeight / 2) + 'px';
  });

  if (node.id !== 'xscan') {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const mx = (px + x) / 2;
    const d = `M ${px} ${py} Q ${mx} ${py}, ${x} ${y}`;
    path.setAttribute('d', d);
    path.setAttribute('stroke', color);
    svg.appendChild(path);
  }

  if (node.children) {
    node.children.forEach(c => build(c, x, y, getColor(c.id) || color));
  }
}

function applyTransform() {
  const ox = window.innerWidth / 2 - CX * scale + panX;
  const oy = window.innerHeight / 2 - CY * scale + panY;
  container.style.transform = `translate(${ox}px, ${oy}px) scale(${scale})`;
  container.style.transformOrigin = '0 0';
}

function zoomIn() { scale = Math.min(scale * 1.25, 3); applyTransform(); }
function zoomOut() { scale = Math.max(scale * 0.8, 0.2); applyTransform(); }
function resetView() { scale = 0.55; panX = 0; panY = 0; applyTransform(); }

container.addEventListener('mousedown', e => { dragging = true; dragStartX = e.clientX - panX; dragStartY = e.clientY - panY; });
window.addEventListener('mousemove', e => { if (!dragging) return; panX = e.clientX - dragStartX; panY = e.clientY - dragStartY; applyTransform(); });
window.addEventListener('mouseup', () => dragging = false);
window.addEventListener('wheel', e => { e.preventDefault(); if (e.deltaY < 0) zoomIn(); else zoomOut(); }, { passive: false });

// Touch support
let lastTouchDist = 0;
container.addEventListener('touchstart', e => {
  if (e.touches.length === 1) { dragging = true; dragStartX = e.touches[0].clientX - panX; dragStartY = e.touches[0].clientY - panY; }
  if (e.touches.length === 2) { lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
});
container.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && dragging) { panX = e.touches[0].clientX - dragStartX; panY = e.touches[0].clientY - dragStartY; applyTransform(); }
  if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if (lastTouchDist) { scale *= d / lastTouchDist; scale = Math.max(0.2, Math.min(3, scale)); applyTransform(); }
    lastTouchDist = d;
  }
});
container.addEventListener('touchend', () => { dragging = false; lastTouchDist = 0; });

build(tree, CX, CY, null);
resetView();
</script>
